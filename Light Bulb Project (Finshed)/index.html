<!DOCTYPE html>
<html>

<body>
    <div>
        <button onclick="document.getElementById('myImage').src='Day.png'">Turn on the light</button>

        <img id="myImage" src="night.png" style="width: 500px;">

        <button onclick="document.getElementById('myImage').src='Night.png'">Turn off the light</button>

<style>
    body {
        background-color: pink;
    }
    button {
        background-color: rgb(248, 152, 165);
        border-radius: 10px;
    }
</style>
</body>
</html>
